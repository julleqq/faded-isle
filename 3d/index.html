<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>The Faded Isle 3D</title>
  <meta name="description" content="A quiet ink-wash exploration game about the six pillars of Acceptance & Commitment Therapy, in first person.">
  <meta name="theme-color" content="#efe7d6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Faded Isle 3D">
  <meta property="og:title" content="The Faded Isle 3D">
  <meta property="og:description" content="A quiet ink-wash journey through the six pillars of ACT.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="../icon-180.png">
  <link rel="icon" href="../icon-180.png">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="style3d.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
  <link rel="modulepreload" href="vendor/three.module.min.js">
</head>
<body>
  <canvas id="game"></canvas>
  <div id="joy" hidden><i></i></div>
  <div id="guide" hidden><svg viewBox="0 0 24 24"><path d="M21 12 5 3l4 9-4 9z"/></svg><span></span></div>

  <div id="hud" hidden>
    <button id="pills" aria-label="Pillars learned"></button>
    <div class="right">
      <button id="soundBtn" aria-label="Sound">
        <svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16 8c1.5 1.2 1.5 6.8 0 8M18.5 5.5c3 2.5 3 10.5 0 13"/></svg>
      </button>
      <button id="journalBtn" aria-label="Journal">
        <svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>
      </button>
    </div>
  </div>

  <button id="act" hidden>Meet</button>
  <div id="toast"></div>
  <div id="panel" hidden></div>
  <div id="dialog" hidden>
    <div class="box"><span class="who" hidden></span><p class="text"></p><div class="opts"></div></div>
  </div>

  <script type="module" src="game3d.js"></script>
</body>
</html>
