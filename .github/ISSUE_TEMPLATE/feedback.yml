name: Feedback on the game
description: Tell us how The Faded Isle felt to play. Everything helps.
title: "[Feedback] "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: Thank you for walking the island. Answer as much or as little as you like. This form is public, so please don't share anything private.
  - type: textarea
    id: felt
    attributes:
      label: How did the game feel?
      placeholder: Calm, confusing, too slow, beautiful…
  - type: textarea
    id: moment
    attributes:
      label: A moment that stayed with you, or one that fell flat
  - type: textarea
    id: change
    attributes:
      label: One thing you would change
  - type: dropdown
    id: device
    attributes:
      label: What did you play on?
      options: [iPhone, Android phone, iPad / tablet, Computer, Other]
  - type: input
    id: context
    attributes:
      label: Game info (filled in automatically)
