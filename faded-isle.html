  <style>
:root {
  --paper: #efe7d6;
  --paper-2: #f7f2e7;
  --ink: #1d1b19;
  --ink-soft: #4a453f;
  --seal: #b33a2e;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; overflow: hidden; background: var(--paper); color: var(--ink);
  font-family: var(--serif); overscroll-behavior: none; -webkit-user-select: none; user-select: none;
  -webkit-text-size-adjust: 100%; touch-action: manipulation;
}
body { position: fixed; inset: 0; }
[hidden] { display: none !important; }
canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
/* No double-tap-zoom anywhere in the UI. #panel scrolls, and touch-action only reaches down
   to the nearest scroll container, so the body's setting doesn't cover what's inside panels.
   :where() keeps this at zero specificity so a stage canvas can still opt into touch-action:none. */
:where(#panel, #panel *, #dialog, #dialog *, #hud, #hud *, button, input, textarea) { touch-action: manipulation; }

button, .linkbtn {
  font: inherit; display: inline-block; text-decoration: none; color: var(--ink); background: var(--paper-2); border: 1.5px solid var(--ink);
  border-radius: 999px; padding: .6em 1.1em; font-size: 16px; cursor: pointer;
  box-shadow: 2px 3px 0 rgba(29, 27, 25, .18);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
button:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(29, 27, 25, .18); background-color: var(--paper); }
button.primary:active, .chip.on:active, .tabs .on:active { background-color: #3a3632; }
button.primary { background: var(--ink); color: var(--paper-2); }
button:disabled { opacity: .4; }
button.quiet { border-style: dashed; background: transparent; box-shadow: none; }

/* HUD */
#hud { position: fixed; top: calc(var(--safe-t) + 10px); left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
#hud > * { pointer-events: auto; }
#hud .right { display: flex; gap: 8px; }
#hud .right button { width: 44px; height: 44px; padding: 10px; display: grid; place-items: center; background: rgba(247, 242, 231, .85); }
#hud svg { width: 22px; height: 22px; fill: none; stroke: var(--ink); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#soundBtn.off .wave { display: none; }
#soundBtn.off svg { opacity: .5; }
#pills { display: flex; gap: 6px; padding: 10px 12px; background: rgba(247, 242, 231, .85); }
#pills i { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--ink); display: block; }

#act {
  position: fixed; right: 20px; bottom: calc(var(--safe-b) + 28px); width: 76px; height: 76px; border-radius: 50%;
  padding: 0 4px; font-size: 17px; line-height: 1.1; background: var(--ink); color: var(--paper-2); border: 3px solid var(--paper-2);
  box-shadow: 0 0 0 2px var(--ink), 3px 5px 0 rgba(0, 0, 0, .2);
}

#toast {
  position: fixed; left: 50%; top: calc(var(--safe-t) + 70px); transform: translateX(-50%); pointer-events: none;
  font-size: 22px; letter-spacing: .06em; color: var(--ink); background: rgba(247, 242, 231, .92); padding: 6px 20px;
  border-radius: 22px; box-shadow: 0 0 18px 6px rgba(247, 242, 231, .7);
  opacity: 0; transition: opacity .8s; font-style: italic; z-index: 10;
  width: max-content; max-width: calc(100vw - 32px); text-align: center; line-height: 1.3; text-wrap: balance;
}
#toast.show { opacity: 1; }

/* Dialog box */
#dialog { position: fixed; inset: 0; z-index: 30; display: flex; align-items: flex-end; padding: 12px 12px calc(var(--safe-b) + 14px); }
#dialog .box {
  position: relative; width: 100%; max-width: 640px; margin: 0 auto; background: var(--paper-2);
  border: 2px solid var(--ink); border-radius: 14px; padding: 18px 18px 22px; box-shadow: 4px 5px 0 rgba(29, 27, 25, .25);
  min-height: 110px;
}
#dialog .who { position: absolute; top: -14px; left: 14px; background: var(--ink); color: var(--paper-2); padding: 2px 12px; border-radius: 999px; font-size: 15px; }
#dialog .text { margin: 0; font-size: 18px; line-height: 1.45; white-space: pre-line; }
#dialog .box.done:not(:has(.opts button))::after { content: '▾'; position: absolute; right: 14px; bottom: 4px; animation: bob 1s infinite; }
#dialog .opts { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
#dialog .opts:empty { display: none; }
@keyframes bob { 50% { transform: translateY(3px); } }

/* Panels */
#panel {
  position: fixed; inset: 0; z-index: 20; overflow-y: auto; -webkit-overflow-scrolling: touch;
  background: var(--paper); padding: calc(var(--safe-t) + 16px) 16px calc(var(--safe-b) + 20px);
  display: flex; flex-direction: column; align-items: center; user-select: text; -webkit-user-select: text;
}
#panel > * { width: 100%; max-width: 560px; }
#panel h2 { font-weight: normal; letter-spacing: .04em; margin: 4px 0 8px; text-align: center; }
#panel .title { font-size: 22px; }
#panel .stage { width: 100%; height: 42vh; min-height: 220px; border: 2px solid var(--ink); border-radius: 12px; background: var(--paper-2); display: block; flex: none; }
#panel .msg { min-height: 3em; font-size: 17px; line-height: 1.45; text-align: center; margin: 12px 0; }
#panel .ctl, #panel .btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 10px; }
.chip { font-size: 15px; padding: .5em .9em; }
.chip.on { background: var(--ink); color: var(--paper-2); }
.own { display: flex; gap: 8px; width: 100%; }
input, textarea { font: inherit; font-size: 16px; flex: 1; width: 100%; padding: .6em .9em; border: 1.5px solid var(--ink); border-radius: 12px; background: var(--paper-2); color: var(--ink); }
textarea { margin-bottom: 8px; resize: none; }

.card { background: var(--paper-2); border: 2px solid var(--ink); border-radius: 14px; padding: 18px; margin: auto 0; box-shadow: 4px 5px 0 rgba(29, 27, 25, .2); }
.card p { font-size: 17px; line-height: 1.5; }
.region { font-style: italic; color: var(--ink-soft); margin: 0 0 4px; text-align: center; }
.learned { border-top: 1px dashed var(--ink-soft); padding-top: 12px; font-style: italic; }
.fine { font-size: 14px; color: var(--ink-soft); text-align: center; line-height: 1.45; }
.more { margin: 10px 0; border-left: 3px solid var(--ink); padding-left: 12px; }
.more .toggle { background: none; border: 0; box-shadow: none; border-radius: 6px; padding: 10px 12px 10px 0; min-height: 44px; font-style: italic; }
.more .toggle:active { transform: none; background: rgba(29, 27, 25, .08); }
.more .toggle::before { content: '+ '; }

window.__SINGLE_FILE__ = true;

const TILE = 32;
const N = 80;                 // map is N x N tiles

const SHRINES = {

  defusion:   { x: 58, y: 23 },
  acceptance: { x: 40, y: 68 },

function buildMap() {

    curve(C, SHRINES.present, 0.12),
    curve(C, SHRINES.defusion, -0.1),
    curve(C, SHRINES.acceptance, 0.08),
    curve(C, SHRINES.selfctx, -0.12),
    curve(C, SHRINES.values, 0.06),
    curve(C, { x: 61, y: 50 }, 0.1),
    curve({ x: 44, y: 13 }, SHRINES.defusion, 0.1),   // summit -> stream, crosses the river

    const n = noise(x * 0.35, y * 0.35, 7);
    if (t === T.GRASS && dist(x, y, FOREST.x, FOREST.y) < FOREST.r && n > 0.35) t = T.FOREST;

    if (t === T.GRASS && hash(x, y, 11) < 0.035) t = T.FOREST;          // lone trees
    if (t === T.GRASS && noise(x * 0.22, y * 0.22, 9) > 0.62) t = T.TALL;  // wild grass
    if (t !== T.SEA && dist(x, y, LAKE.x, LAKE.y) < LAKE.r + (noise(x * .4, y * .4, 5) - .5) * 2) t = T.WATER;

}

function tileAt(map, px, py) {
  const x = Math.floor(px / TILE), y = Math.floor(py / TILE);

}
function walkable(map, px, py) { return WALKABLE.has(tileAt(map, px, py)); }

// Which pillar region is this point in (for ambience / labels)?
function regionAt(px, py) {
  const x = px / TILE, y = py / TILE;
  let best = null, bd = 12;
  for (const k in SHRINES) {
    const d = dist(x, y, SHRINES[k].x, SHRINES[k].y);
    if (d < bd) { bd = d; best = k; }

}

// ---------- painting ----------
const PAPER = '#efe7d6';

function clear(c) {
  if (c[0] === '#') return c + '00';

// A canvas with a draw loop, a message line and a button row.
function stage(p, title, cls = '') {
  const cv = h('canvas', { class: 'stage ' + cls }), msg = h('p', { class: 'msg' }), ctl = h('div', { class: 'ctl' });
  p.append(h('h2', { class: 'title' }, title), cv, msg, ctl);
  const g = cv.getContext('2d'), dpr = Math.min(2, devicePixelRatio || 1);
  let W = 0, H = 0, raf, draw = () => {};
  const t0 = performance.now();
  const tick = () => {
    const r = cv.getBoundingClientRect();
    if (r.width !== W || r.height !== H) { W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr; }
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    draw(g, W, H, (performance.now() - t0) / 1000);
    raf = requestAnimationFrame(tick);
  };
  tick();
  return {
    cv, ctl,
    draw(f) { draw = f; },
    msg(t) { msg.textContent = t; },
    // Hold the message line at the height of the longest text it will show, so the
    // buttons below never move (translations are often longer than the English).
    reserve(texts) {
      const now = msg.textContent; let hh = 0;
      for (const t of texts) { msg.textContent = t; hh = Math.max(hh, msg.offsetHeight); }
      msg.textContent = now; if (hh) msg.style.minHeight = hh + 'px';
    },
    stop() { cancelAnimationFrame(raf); },
    set(...nodes) { ctl.replaceChildren(...nodes); },
    pt(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; },
    // One tap acts once: the tapped button shows pressed at once, the others disable.
    // firstTap also ignores the tail of a double tap on whatever was here before.
    buttons(labels, cls = i => i === 0 ? 'primary' : '', wrap = '') {
      return new Promise(res => {
        const act = firstTap((i, t) => {
          for (const b of bs) if (b === t) b.classList.add('on'); else b.disabled = true;
          audio.soft(); res(i);
        });
        const bs = labels.map((l, i) => h('button', { class: cls(i), onclick: e => act(i, e.currentTarget) }, l));
        ctl.replaceChildren(...(wrap ? [h('div', { class: wrap }, bs)] : bs));
      });
    },
  };
}
const ease = t => t < .5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2;
function pill(g, x, y, w, hh) {
  const r = hh / 2;
  g.beginPath(); g.arc(x + r, y + r, r, Math.PI / 2, Math.PI * 1.5); g.arc(x + w - r, y + r, r, -Math.PI / 2, Math.PI / 2); g.closePath();
}
function label(g, text, x, y, font, align = 'center') {       // ink text with a paper halo
  g.font = font; g.textAlign = align; g.lineJoin = 'round';
  g.strokeStyle = 'rgba(247,242,231,.85)'; g.lineWidth = 4; g.strokeText(text, x, y);
  g.fillStyle = INK; g.fillText(text, x, y);
}
// A centred label kept wholly inside the canvas (shrunk if it is wider than the canvas),
// fading in and out as its anchor x crosses the left/right edges.
function edgeLabel(g, text, x, y, px, style, W) {
  g.font = `${style} ${px}px ${SERIF}`;
  let w = g.measureText(text).width;
  if (w > W - 12) { px = Math.max(9, Math.floor(px * (W - 12) / w)); g.font = `${style} ${px}px ${SERIF}`; w = g.measureText(text).width; }
  const a0 = g.globalAlpha;
  g.globalAlpha = a0 * clamp((Math.min(x, W - x) + 30) / 40, 0, 1);
  label(g, text, clamp(x, w / 2 + 6, W - w / 2 - 6), y, `${style} ${px}px ${SERIF}`);
  g.globalAlpha = a0;
}
// A label under a lantern: breaks onto two lines, or shrinks, to stay within maxW.
function fitLabel(g, text, x, y, maxW, px) {
  g.font = px + 'px ' + SERIF;
  if (g.measureText(text).width <= maxW) return g.fillText(text, x, y);
  const words = text.split(' ');
  if (words.length > 1) {
    let best = null;
    for (let i = 1; i < words.length; i++) {
      const l = [words.slice(0, i).join(' '), words.slice(i).join(' ')], w = Math.max(...l.map(s => g.measureText(s).width));
      if (!best || w < best.w) best = { l, w };
    }
    if (best.w > maxW) { px = Math.max(10, Math.floor(px * maxW / best.w)); g.font = px + 'px ' + SERIF; }
    best.l.forEach((s, i) => g.fillText(s, x, y + i * (px + 2)));
    return;
  }
  g.font = Math.max(10, Math.floor(px * maxW / g.measureText(text).width)) + 'px ' + SERIF;
  g.fillText(text, x, y);
}

// ---------- Present Moment: breathe with the orb, then notice ----------
async function present(p, S) {
  const T = TEXT.present, st = stage(p, PILLARS.present.region);
  let r = 0.35, word = '', skip = false;
  st.draw((g, W, H, t) => {
    const gr = g.createRadialGradient(W / 2, H / 2, 10, W / 2, H / 2, Math.max(W, H) * .7);
    gr.addColorStop(0, '#e8efd9'); gr.addColorStop(1, '#b9cf9c'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
    for (let i = 0; i < 7; i++) {                             // bamboo silhouettes
      const x = (i + .5) * W / 7 + Math.sin(t * .5 + i) * 3;
      g.fillStyle = 'rgba(47,90,47,.25)'; g.fillRect(x - 3, 0, 6, H);
    }
    const R = Math.min(W, H) * r;
    g.fillStyle = 'rgba(111,158,90,.35)'; g.beginPath(); g.arc(W / 2, H / 2, R, 0, Math.PI * 2); g.fill();
    drawEnso(g, W / 2, H / 2, R, INK, 4, 11);
    drawGuardian(g, 'present', W * .85, H - 10, t, true, PILLARS.present.color);
    g.fillStyle = INK; g.font = '20px ' + SERIF; g.textAlign = 'center'; g.fillText(word, W / 2, H / 2 + 7);
  });
  st.msg(T.intro);
  st.reserve([T.intro, fmt(T.breath, { n: 3 }), T.notice, fmt(T.count, { n: 3 }), T.enough]);
  if (await st.buttons([T.begin, T.skip]) === 1) skip = true;
  const skipBtn = h('button', { onclick: firstTap(() => { skip = true; skipBtn.disabled = true; }) }, T.skip);
  st.set(skipBtn);
  const animate = async (from, to, secs, text, inhale) => {
    word = text; audio.breath(inhale, secs);
    const t0 = performance.now();
    while (!skip) {
      const k = Math.min(1, (performance.now() - t0) / (secs * 1000));
      r = from + (to - from) * ease(k);
      if (k >= 1) break;
      await wait(30);
    }
  };
  for (let c = 0; c < 3 && !skip; c++) {
    st.msg(fmt(T.breath, { n: c + 1 }));
    await animate(0.2, 0.42, 4, T.in, true);
    await animate(0.42, 0.2, 6, T.out, false);
  }
  word = ''; r = 0.3;
  st.cv.classList.add('short');                            // room for the list without scrolling
  st.msg(T.notice);
  let n = 0;
  await new Promise(res => {
    const go = h('button', { class: 'primary', disabled: '', onclick: firstTap(() => { go.classList.add('on'); audio.soft(); res(); }) }, T.cont);
    const chips = T.things.map(s => { const b = h('button', { class: 'chip', onclick: firstTap(() => {
      b.classList.add('on'); audio.soft(); n++;
      st.msg(n >= 4 ? T.enough : fmt(T.count, { n }));
      if (n >= 4) go.disabled = false;
    }) }, s); return b; });
    st.set(h('div', { class: 'chips grid2' }, chips), go);
  });
  st.stop();
}

// ---------- Defusion: put thoughts on leaves ----------
async function defusion(p, S) {
  const T = TEXT.defusion, st = stage(p, PILLARS.defusion.region);
  const leaves = [];
  st.draw((g, W, H, t) => {
    g.fillStyle = '#e9dcc0'; g.fillRect(0, 0, W, H);
    g.fillStyle = '#6fa7bb'; g.fillRect(0, H * .25, W, H * .5);
    g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = 1.5;
    for (let i = 0; i < 14; i++) {
      const y = H * .28 + (i % 7) * H * .065, x = ((t * 30 + i * 67) % (W + 80)) - 40;
      g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + 15, y - 4, x + 30, y); g.stroke();
    }
    for (const l of leaves) {
      l.x += 0.55; const y = l.y * H + Math.sin(t * 1.5 + l.seed) * 6;
      const a = Math.max(0, Math.min(1, (W + 20 - l.x) / 120));
      g.save(); g.globalAlpha = a; g.translate(l.x, y); g.rotate(Math.sin(t + l.seed) * .3);
      g.fillStyle = l.color; g.beginPath(); g.ellipse(0, 0, 16, 9, 0, 0, Math.PI * 2); g.fill();
      g.strokeStyle = INK; g.lineWidth = 1; g.beginPath(); g.moveTo(-14, 0); g.lineTo(14, 0); g.stroke();
      g.restore();
      g.globalAlpha = a * clamp((l.x + 60) / 40, 0, 1);                   // a queued leaf's label waits off-canvas
      g.fillStyle = INK; g.font = 'italic 13px ' + SERIF; g.textAlign = 'center';
      const tw = Math.min(g.measureText(l.text).width, W - 12);                // the whole thought stays on the canvas
      g.fillText(l.text, clamp(l.x, tw / 2 + 6, W - tw / 2 - 6), y - 16, W - 12); g.globalAlpha = 1;
    }
    drawGuardian(g, 'defusion', W * .15, H * .62, t, true, PILLARS.defusion.color);
  });
  st.msg(T.intro);
  st.reserve([T.intro, ...T.having, fmt(T.havingOwn, { thought: 'mmmmmmm mmmmmmm mmmmmmm mmmmmmm mmmmm' })]);
  let placed = 0;
  await new Promise(res => {
    const go = h('button', { class: 'primary', disabled: '', onclick: firstTap(() => { go.classList.add('on'); audio.soft(); res(); }) }, T.cont);
    const place = (text, sentence) => {
      st.msg(sentence);
      // three lanes, so labels don't overlap: the new leaf takes the lane with the most room,
      // and if even that lane is busy it waits upstream, a label's width behind the last leaf
      const g = st.cv.getContext('2d'); g.font = 'italic 13px ' + SERIF;
      const w = g.measureText(text).width;
      const last = y => leaves.filter(l => l.y === y).sort((p, q) => p.x - q.x)[0];
      const room = y => (last(y) ? last(y).x : Infinity);
      const lane = [.4, .56, .7].sort((a, b) => room(b) - room(a))[0], prev = last(lane);
      const x = prev ? Math.min(-20, prev.x - w - prev.w / 2 - 34) : -20;
      leaves.push({ text, w, x, y: lane, seed: Math.random() * 9, color: ['#d9823b', '#c4552f', '#e0a53c'][placed % 3] });
      placed++; audio.soft();
      if (placed >= 3) go.disabled = false;
    };
    const chips = T.thoughts.map((t, i) => { const b = h('button', { class: 'chip', onclick: firstTap(() => { b.disabled = true; place(t, T.having[i] || fmt(T.havingOwn, { thought: t })); }) }, t); return b; });
    const input = h('input', { type: 'text', maxlength: '40', placeholder: T.own, enterkeyhint: 'done' });
    const own = h('form', { class: 'own', onsubmit: e => { e.preventDefault(); const v = input.value.trim(); if (v) { place(v, fmt(T.havingOwn, { thought: v })); input.value = ''; input.blur(); } } },
      input, h('button', { type: 'submit' }, T.leaf));
    st.set(h('div', { class: 'chips' }, chips), go, own);
  });
  st.stop();
  await say(T.outro);
}

// ---------- Acceptance: walk into the waves, run from them, or stay ----------
async function acceptance(p, S) {
  const T = TEXT.acceptance, st = stage(p, PILLARS.acceptance.region, 'drag tall');
  let me = null, joy = null, wave = null, last = 0, phase2 = false, calm = 0, walked = false;
  let effort = 10, shown = 10, splash = 0, ripple = 0, tumble = 0, tumble0 = 1, spin = 1, kb = 0;
  const intent = { x: 0, y: 0 };                             // joystick direction, smoothed over ~0.3 s
  // floating joystick: press anywhere on the shore and drag
  st.cv.addEventListener('pointerdown', e => {
    e.preventDefault(); const q = st.pt(e);
    joy = { id: e.pointerId, ox: q.x, oy: q.y, x: q.x, y: q.y };
    try { st.cv.setPointerCapture(e.pointerId); } catch (_) {}
  });

  const end = e => { if (joy && e.pointerId === joy.id) joy = null; };

  const hit = () => {
    const m = Math.hypot(intent.x, intent.y), ax = Math.abs(intent.x) * .7;
    const o = m < .3 ? 'still' : -intent.y > ax ? 'into' : intent.y > ax ? 'away' : 'side';
    if (o === 'still') { ripple = 1; audio.bell(392, .05); effort -= phase2 ? 25 : 8; }
    else {
      audio.thud(); splash = o === 'into' ? 1.4 : 1;
      tumble = tumble0 = o === 'into' ? .9 : 1.2; spin = o === 'side' ? Math.sign(intent.x) : o === 'into' ? -1 : 1;
      kb = o === 'into' ? 240 : 150; effort += o === 'into' ? 40 : 32;
    }
    effort = clamp(effort, 0, 100); wave.outcome = o; wave.onhit(o);
  };
  st.draw((g, W, H, t) => {
    const dt = Math.min(.05, t - last); last = t;
    const sea = H * .34;
    if (!me) me = { x: W * .4, y: H * .72, dir: 1, phase: 0 };
    // move
    let ix = 0, iy = 0;
    if (joy) { ix = (joy.x - joy.ox) / 44; iy = (joy.y - joy.oy) / 44; const m = Math.hypot(ix, iy); if (m > 1) { ix /= m; iy /= m; } else if (m < .15) ix = iy = 0; }
    const k = 1 - Math.exp(-dt / .3); intent.x += (ix - intent.x) * k; intent.y += (iy - intent.y) * k;
    const wet = wave && wave.y > me.y - 4;
    if (tumble > 0) tumble -= dt;
    else if (ix || iy) {
      const sp = wet ? 25 : 60;
      me.x += ix * sp * dt; me.y += iy * sp * dt; me.phase += dt * 10; walked = true;
      if (Math.abs(ix) > .2) me.dir = Math.sign(ix);
      if (wet) effort = Math.min(100, effort + 12 * dt);     // struggling in the water
    }
    if (kb > 0) { me.y += kb * dt; kb = Math.max(0, kb - 520 * dt); }
    if (!wet) effort = Math.max(0, effort - 1.2 * dt);
    me.x = clamp(me.x, 26, W - 26); me.y = clamp(me.y, sea + 24, H - 22);
    // the wave: out at sea first, then up the beach (faster than you can walk), then back
    if (wave) {
      if (wave.dir > 0) {
        wave.y += (wave.y < sea ? sea / 1.8 : 95) * dt;
        if (!wave.hit && wave.y >= me.y - 2) { wave.hit = true; hit(); }
        if (wave.y >= H + 12) wave.dir = -1;
      } else if ((wave.y -= 100 * dt) <= sea) { const w = wave; wave = null; w.res(w.outcome); }
    }
    // draw: sand, sea, wave
    g.fillStyle = '#e3cc98'; g.fillRect(0, 0, W, H);
    g.fillStyle = '#5f9fb5'; g.beginPath(); g.moveTo(0, 0);
    for (let x = 0; x < W + 10; x += 10) g.lineTo(x, sea + Math.sin(x / 40 + t) * 3);
    g.lineTo(W, 0); g.fill();
    if (wave) {
      const wy = wave.y, edge = x => wy + Math.sin(x / 26 + t * 3) * 5;
      g.fillStyle = wy > sea ? 'rgba(95,159,181,.75)' : 'rgba(35,95,125,.45)';
      g.beginPath(); g.moveTo(0, wy > sea ? sea - 4 : wy - 22);
      for (let x = 0; x < W + 8; x += 8) g.lineTo(x, edge(x));
      g.lineTo(W, wy > sea ? sea - 4 : wy - 22); g.fill();
      g.strokeStyle = '#fff'; g.lineWidth = 4; g.beginPath();
      for (let x = 0; x < W + 8; x += 8) g.lineTo(x, edge(x)); g.stroke();
      g.fillStyle = 'rgba(255,255,255,.8)';
      for (let i = 0; i < 12; i++) { const x = (i * 53 + t * 20) % W; g.beginPath(); g.arc(x, edge(x) - 5, 2.5, 0, 7); g.fill(); }
    }

    // you

    g.save(); g.translate(me.x, me.y - 16); g.rotate(rot); drawCharacter(g, S.char, 0, 16, me.dir, me.phase, 1.5); g.restore();
    if (wet) {
      g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 2;
      g.beginPath(); g.ellipse(me.x, me.y, 18 + Math.sin(t * 4) * 2, 6, 0, 0, 7); g.stroke();
    }

    shown += (effort - shown) * Math.min(1, dt * 3);
    g.font = '13px ' + SERIF; const lw = g.measureText(T.effort).width, bw = 64;
    g.fillStyle = 'rgba(247,242,231,.92)'; pill(g, 8, 8, lw + bw + 30, 26); g.fill();

function makeCanvas(cv, T) {

    const r = cv.getBoundingClientRect();
    if (r.width !== W || r.height !== H) { W = r.width; H = r.height; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    const t = (now() - t0) / 1000;
    if (W > 0 && H > 0) (T.mode === 'forks' ? drawForkView : drawTreeView)(g, W, H, t, T);
    raf = requestAnimationFrame(tick);
  };

}

// ---------- the screen: title, tree canvas, message, body, sticky bottom bar ----------
function makeView(p) {
  p.innerHTML = '';
  p.classList.add('finale');
  const cv = h('canvas', { class: 'ftree big', role: 'img', 'aria-label': TEXT.canvasLabel });
  const msg = h('div', { class: 'fmsg', 'aria-live': 'polite' }), body = h('div', { class: 'fbody' });
  const hint = h('p', { class: 'fhint', 'aria-live': 'polite' }), row = h('div', { class: 'frow' });
  p.append(h('h2', { class: 'title' }, TEXT.title), cv, msg, body, h('div', { class: 'fbar' }, hint, row));
  return {
    p, cv, body, hint, row,
    // size: 'pin' (small, stays in view while the chips scroll), 'mid' or 'big'
    reset(size) { p.classList.toggle('fpin', size === 'pin'); cv.classList.toggle('big', size === 'big'); msg.replaceChildren(); body.replaceChildren(); row.replaceChildren(); this.setHint(null); p.scrollTop = 0; },
    msg(...parts) { msg.replaceChildren(...parts.flat().filter(Boolean).map(x => typeof x === 'string' ? h('p', {}, x) : x)); },
    setHint(text) { hint.hidden = text == null; hint.textContent = text || ''; },
    nudge() { hint.classList.remove('nudge'); void hint.offsetWidth; hint.classList.add('nudge'); audio.soft(); },
    // One or more buttons in the bar; resolves with the index tapped.

    },
    // Stacked choices in the bar; the tapped one stays marked, the rest disable.

        const bs = labels.map((text, i) => btn(text, '', (e, b) => {
          bs.forEach(x => { x.disabled = true; }); b.classList.add('picked'); if (i === awayIdx) b.classList.add('away');

}
const tag = pillar => h('p', { class: 'ftag', style: `--c:${PILLARS[pillar].color}` }, PILLARS[pillar].name);
const speak = lines => say(lines.map(l => `${TEXT.tree}: ${l}`));

// ---------- steps ----------
function situationStep(V, F) {
  V.reset('mid');
  V.msg(TEXT.situationPrompt);
  const ta = h('textarea', { rows: '3', maxlength: '300', placeholder: TEXT.situationPlaceholder, 'aria-label': TEXT.situationPrompt });
  ta.value = F.situation;

// Choose-and-write step for away (side -1) or toward (side 1) moves.
function pickStep(V, T, st, side, S) {
  V.reset('pin');
  V.msg(side < 0 ? TEXT.awayPrompt : TEXT.towardPrompt);
  const key = text => (side < 0 ? 'a:' : 't:') + text.toLowerCase();
  if (side > 0 && S.values && S.values.length) V.body.append(h('p', { class: 'fnote' }, fmt(TEXT.lanterns, { values: S.values.map(valueName).join(TEXT.listSep) })));
  const chips = h('div', { class: 'chips fchips' });
  let go;
  let input;
  const counts = () => {                                 // a typed-but-not-yet-added move counts too
    const own = st.own.filter(o => o.on).length + (input && input.value.trim() ? 1 : 0), pre = st.presets.filter(p => st.sel.has(p)).length;
    return { own, pre: pre + Math.max(0, own - 1) };     // extra written moves count toward the three
  };

    const c = counts(), needC = Math.max(0, 3 - c.pre), needO = c.own ? 0 : 1, parts = [];
    if (needC) parts.push(needC === 1 ? TEXT.needChooseOne : fmt(TEXT.needChooseMany, { n: needC }));
    if (needO) parts.push(TEXT.needOwn);
    V.setHint(parts.length ? parts.join(TEXT.listSep) : TEXT.ready);
    go.classList.toggle('off', parts.length > 0);
    go.setAttribute('aria-disabled', parts.length ? 'true' : 'false');
  };
  const chip = (text, isOn, cls, toggle) => {
    const c = btn(showMove(text), 'chip ' + cls + (isOn ? ' on' : ''), () => {
      const on = toggle();
      c.classList.toggle('on', on); c.setAttribute('aria-pressed', on);
      if (on) { addLeaf(T, side, key(text)); audio.soft(); } else dropLeaf(T, key(text));
      update();
    }, false);
    c.setAttribute('aria-pressed', isOn);
    return c;
  };
  for (const p of st.presets) chips.append(chip(p, st.sel.has(p), st.lan && st.lan.has(p) ? 'lan' : '', () => { st.sel.has(p) ? st.sel.delete(p) : st.sel.add(p); return st.sel.has(p); }));
  const ownChip = o => chip(o.text, o.on, 'ownchip', () => (o.on = !o.on));
  for (const o of st.own) chips.append(ownChip(o));
  input = h('input', { type: 'text', maxlength: '60', autocomplete: 'off', enterkeyhint: 'done', placeholder: side < 0 ? TEXT.awayPlaceholder : TEXT.towardPlaceholder, 'aria-label': side < 0 ? TEXT.awayPlaceholder : TEXT.towardPlaceholder });
  const add = () => {
    const text = input.value.trim().replace(/\s+/g, ' ');
    if (!text) { input.focus(); return false; }
    input.value = '';
    const same = [...chips.children].find(c => c.textContent.toLowerCase() === text.toLowerCase());
    if (same) { if (!same.classList.contains('on')) same.click(); update(); return true; }
    const o = { text, on: true }; st.own.push(o);
    chips.append(ownChip(o)); addLeaf(T, side, key(text)); audio.soft(); update();
    return true;
  };

  input.addEventListener('input', () => update());
  V.body.append(chips, form);
  return new Promise(res => {
    go = btn(TEXT.continue, 'primary', () => {
      if (input.value.trim()) add();
      const c = counts();
      if (c.pre < 3 || !c.own) { V.nudge(); return; }
      audio.soft(); res('next');
    }, false, 300);

    update();
  });
}

async function forksStep(V, T, F, awayPool) {
  V.reset('mid');
  Object.assign(T, { mode: 'forks', fork: 0, done: 0, hookA: 0, camY: null, walk: { kind: 'fork', i: 0, u: 0, dir: 1, moving: false } });
  V.msg(TEXT.forksIntro);
  await V.buttons([[TEXT.startClimb, 'primary']]);
  let ap = 0;
  const nextAway = () => awayPool[ap++ % awayPool.length];
  for (let i = 0; i < 6; i++) {
    const def = FORKS[i], tx = TEXT.forks[def.pillar], best = skillOf(def.pillar), other = skillOf(def.other);
    const rec = { pillar: def.pillar, skill: null, fit: null, awayTried: [] };
    T.fork = i; T.hookA = 0; tween(600, k => { T.hookA = k; });
    V.msg(fmt(TEXT.forkPrompt, { n: i + 1, total: 6 }));
    const opts = shuffle([{ kind: 'best', move: best }, { kind: 'other', move: other }, { kind: 'away', text: nextAway() }]);
    for (;;) {
      const awayIdx = opts.findIndex(o => o.kind === 'away');
      const k = await V.options(opts.map(o => o.kind === 'away' ? showMove(o.text) : MOVES[o.move].name), awayIdx);
      const o = opts[k];
      if (o.kind === 'away') {
        V.msg(fmt(rec.awayTried.length ? TEXT.awayAgain : TEXT.awayLine, { move: showMove(o.text) }));
        rec.awayTried.push(o.text);
        await walkAway(T, i);
        if (awayPool.length > 1) o.text = nextAway();
        continue;
      }
      rec.skill = o.move; rec.fit = o.kind;
      V.msg(tag(def.pillar), o.kind === 'best' ? tx.best : fmt(tx.other, { best: MOVES[best].name }));
      audio.bell([392, 440, 494, 587, 659, 784][i], .07);
      await walkArc(T, i);
      break;
    }
    F.forks.push(rec);
    await V.buttons([[i < 5 ? TEXT.keepClimbing : TEXT.continue, 'primary']]);
  }
  // back out to the whole tree; the colours spread along the toward branch
  V.reset('big');
  T.mode = 'tree'; T.progress = 0;
  V.msg(TEXT.forksDone);
  audio.chime();
  await tween(2600, k => { T.progress = 6 * k; });
  await V.buttons([[TEXT.continue, 'primary']]);
}
async function walkArc(T, i) {

  await tween(1500, k => { T.walk.u = ease(k); T.walk.dir = T.walk.u < .5 ? 1 : -1; });   // the arc bends right, then back

}

    await ui.say([FT.gatherIntro]);
    let i = 0;
    for (const k of ['present', 'defusion', 'acceptance', 'selfctx', 'action', 'values']) {
      if (k !== 'values') { gathered.add(k); const g = guardPos(k); paint(g.x, g.y, 70, .9); }
      audio.bell([392, 440, 494, 523, 587, 659][i++], .06);

const SERIF = '"Iowan Old Style", Palatino, Georgia, serif';
// Drawn after the world: the sunset tint, the planted lantern, and the way to the summit.
function drawDusk(t, sx, sy, k) {
  if (dusk > .01) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const g = ctx.createLinearGradient(0, 0, 0, cv.height);
    g.addColorStop(0, `rgba(240, 132, 84, ${.36 * dusk})`);
    g.addColorStop(.5, `rgba(222, 128, 110, ${.18 * dusk})`);
    g.addColorStop(1, `rgba(78, 58, 118, ${.3 * dusk})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.setTransform(k, 0, 0, k, -sx * k, -sy * k);
  }
  if (S.lantern) drawLantern(t);
  if (procession && !S.finaleGathered && !gathering) drawGuide(t, sx, sy, k);
}
function drawLantern(t) {
  const L = S.lantern, glow = lanternT == null ? 1 : Math.min(1, (performance.now() - lanternT) / 2500);
  const x = L.x, y = L.y - 20, r = 36 + Math.sin(t * 2) * 4;
  const g = ctx.createRadialGradient(x, y, 2, x, y, r * 1.6);
  g.addColorStop(0, `rgba(255, 210, 110, ${.8 * glow})`); g.addColorStop(1, 'rgba(255, 210, 110, 0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 1.6, 0, 7); ctx.fill();
  ctx.strokeStyle = '#1d1b19'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(L.x, L.y); ctx.lineTo(L.x, y + 8); ctx.stroke();
  ctx.fillStyle = glow < 1 ? `rgb(${Math.round(160 + 86 * glow)}, ${Math.round(150 + 44 * glow)}, ${Math.round(130 - 56 * glow)})` : '#f6c24a';
  ctx.beginPath(); ctx.ellipse(x, y, 7, 9, 0, 0, 7); ctx.fill();
  ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(x, y, 7, 9, 0, 0, 7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x - 7, y); ctx.lineTo(x + 7, y); ctx.stroke();
  if (!L.text || glow < .5) return;
  ctx.font = `italic 9px ${SERIF}`; ctx.textAlign = 'center';
  const words = FIN.showMove(L.text).split(/\s+/), lines = []; let cur = '';
  for (const w of words) { const tt = cur ? cur + ' ' + w : w; if (cur && ctx.measureText(tt).width > 130) { lines.push(cur); cur = w; } else cur = tt; }
  lines.push(cur);
  lines.forEach((l, i) => {
    const ly = y - 16 - (lines.length - 1 - i) * 11;
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(247, 242, 231, .85)'; ctx.strokeText(l, x, ly);
    ctx.fillStyle = '#1d1b19'; ctx.fillText(l, x, ly);
  });
}
function drawGuide(t, sx, sy, k) {
  const s = summit(), Wd = cv.width, Hd = cv.height, d = dpr;
  const px = (s.x - sx) * k, py = (s.y - 40 - sy) * k;
  const mL = 34 * d, mR = Wd - 34 * d, mT = 150 * d, mB = Hd - 150 * d;   // below the HUD and toasts, above the act button
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (px > mL && px < mR && py > mT && py < mB) {           // in view: a soft light over the summit
    const g = ctx.createRadialGradient(px, py, 2, px, py, 30 * d);
    g.addColorStop(0, 'rgba(255, 214, 120, .9)'); g.addColorStop(1, 'rgba(255, 214, 120, 0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, py + Math.sin(t * 2) * 3 * d, 30 * d, 0, 7); ctx.fill();
    return;
  }
  const cx = Wd / 2, cy = Hd / 2, dx = px - cx, dy = py - cy;
  const sc = Math.min(dx > 0 ? (mR - cx) / dx : dx < 0 ? (mL - cx) / dx : Infinity, dy > 0 ? (mB - cy) / dy : dy < 0 ? (mT - cy) / dy : Infinity);
  const ang = Math.atan2(dy, dx), bob = Math.sin(t * 3) * 4 * d;
  const ax = cx + dx * sc + Math.cos(ang) * bob, ay = cy + dy * sc + Math.sin(ang) * bob;
  ctx.save(); ctx.translate(ax, ay); ctx.rotate(ang); ctx.globalAlpha = .85; ctx.fillStyle = '#1d1b19';
  ctx.beginPath(); ctx.moveTo(15 * d, 0); ctx.lineTo(-9 * d, -11 * d); ctx.lineTo(-3 * d, 0); ctx.lineTo(-9 * d, 11 * d); ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.font = `italic ${15 * d}px ${SERIF}`; ctx.textAlign = 'center';
  const tw = ctx.measureText(FT.summitLabel).width;
  const lx = Math.max(tw / 2 + 8 * d, Math.min(Wd - tw / 2 - 8 * d, ax - Math.cos(ang) * 34 * d)), ly = ay - Math.sin(ang) * 30 * d + 5 * d;
  ctx.lineWidth = 4 * d; ctx.strokeStyle = 'rgba(247, 242, 231, .9)'; ctx.strokeText(FT.summitLabel, lx, ly);
  ctx.fillStyle = '#1d1b19'; ctx.fillText(FT.summitLabel, lx, ly);
}

// ---------- encounters ----------
async function encounter() {
  const unmet = C.CREATURES.filter(c => !S.spirits[c.id]);
  const cr = unmet.length && Math.random() < .75 ? unmet[Math.floor(Math.random() * unmet.length)] : C.CREATURES[Math.floor(Math.random() * C.CREATURES.length)];
  const known = !!S.spirits[cr.id];
  let struggle = known ? 40 : 60, shown = struggle;
  const p = ui.openPanel('encounter');
  const cvs = h('canvas', { class: 'stage' }), meter = h('div', { class: 'meter' }, h('i')), msg = h('p', { class: 'msg' }), moves = h('div', { class: 'moves' });
  p.append(h('h2', { class: 'title' }, cr.name), cvs, h('p', { class: 'thought' }, cr.thought), h('label', { class: 'mlabel' }, U.struggle), meter, msg, moves);
  const g = cvs.getContext('2d'); let raf;
  const draw = () => {
    const r = cvs.getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1);
    if (cvs.width !== Math.round(r.width * d)) { cvs.width = r.width * d; cvs.height = r.height * d; }
    const t = performance.now() / 1000;
    shown += (struggle - shown) * .05;
    g.setTransform(d, 0, 0, d, 0, 0); g.clearRect(0, 0, r.width, r.height);
    const calm = 1 - shown / 100, cx = r.width * .64, cy = r.height * .52;
    const platform = (x, y, w) => { g.fillStyle = 'rgba(29,27,25,.12)'; g.beginPath(); g.ellipse(x, y, w, w * .28, 0, 0, 7); g.fill();
      g.strokeStyle = 'rgba(29,27,25,.45)'; g.lineWidth = 2; g.beginPath(); g.ellipse(x, y, w, w * .28, 0, .3, 2.6); g.stroke(); };
    platform(cx, cy + 4, 70); platform(r.width * .26, r.height * .92, 60);
    drawCharacter(g, S.char, r.width * .26, r.height * .92, 1, 0, 2.4);
    g.strokeStyle = 'rgba(29,27,25,.5)';
    for (let i = 0; i < Math.round(shown / 8); i++) {         // the ink storm of struggle
      g.lineWidth = 1 + (i % 3); g.beginPath();
      const rr = 50 + i * 4, a0 = t * (1 + i % 3) + i;
      g.ellipse(cx, cy - 30, rr, rr * .55, 0, a0, a0 + 1.2 + (i % 4) * .4); g.stroke();
    }
    drawCreature(g, cr, cx, cy, 3, t, calm);
    meter.firstChild.style.width = shown + '%';
    raf = requestAnimationFrame(draw);
  };
  draw();
  const learned = ['notice', ...C.PILLAR_ORDER.filter(k => S.done[k]).map(k => C.PILLARS[k].move)];
  const SOFTENS = U.softens, TIP = U.tip;
  // Reserve room for the longest message this encounter can show, so the move buttons never jump between turns.
  msg.style.minHeight = Math.max(...[...learned.map(id => C.MOVES[id].text + SOFTENS), ...C.STRUGGLE_MOVES.map(m => m.text + (S.tip ? '' : TIP))]
    .map(t => (msg.textContent = t, msg.offsetHeight))) + 'px';
  msg.textContent = fmt(known ? U.metAgain : U.wild, { name: cr.name });

  const outcome = await new Promise(res => {
    const turn = () => {
      moves.innerHTML = '';
      const tempt = C.STRUGGLE_MOVES[Math.floor(Math.random() * C.STRUGGLE_MOVES.length)];
      const opts = learned.map(id => ({ label: C.MOVES[id].name, act: () => useMove(id) }));
      opts.splice(Math.floor(Math.random() * (opts.length + 1)), 0, { label: tempt.name, act: () => fight(tempt), tempt: true });
      opts.forEach(o => moves.append(h('button', { onclick: o.act, 'data-move': o.tempt ? 'struggle' : 'skill' }, o.label)));
      moves.append(h('button', { class: 'quiet', onclick: () => res('left') }, U.walkOn));
    };
    const useMove = id => {
      const m = C.MOVES[id], weak = m.pillar && cr.weak.includes(m.pillar);
      struggle = Math.max(0, struggle + m.effect * (weak ? 1.6 : 1));
      msg.textContent = m.text + (weak ? SOFTENS : '');
      audio.soft();
      if (struggle <= 0) return res('friend');
      turn();
    };
    const fight = m => {
      struggle = Math.min(100, struggle + 18);
      msg.textContent = m.text;
      audio.thud();
      if (!S.tip) { S.tip = true; msg.textContent += TIP; }
      if (struggle >= 100) return res('tired');
      turn();
    };
    turn();
  });
  moves.innerHTML = '';
  if (outcome === 'friend') {
    audio.chime();
    msg.textContent = fmt(U.friend, { name: cr.name });
    const first = !S.spirits[cr.id];
    S.spirits[cr.id] = true; save();
    if (first) msg.after(h('p', { class: 'lore' }, cr.lore), h('p', { class: 'fine' }, U.addedJournal));
    paint(player.x, player.y, 220, .8);
  } else if (outcome === 'tired') {
    msg.textContent = fmt(U.tired, { name: cr.name });
  } else {
    msg.textContent = fmt(U.left, { name: cr.name });
  }
  await new Promise(res => moves.append(h('button', { class: 'primary', onclick: ui.firstTap(res) }, U.continue)));
  cancelAnimationFrame(raf);
  ui.closePanel();
}

// ---------- feedback ----------
// Sent anonymously to a Google Form. Only the typed message plus progress counts and
// device type are sent, never anything written elsewhere in the game.
async function openFeedback() {
  ui.closePanel();
  const p = ui.openPanel('exercise');
  const text = h('textarea', { id: 'feedback-text', rows: '6', maxlength: '1500', placeholder: U.fbPlaceholder });
  const i = await ui.card(p, U.feedback, [
    h('p', {}, U.fbIntro),
    text,
    h('p', { class: 'fine' }, U.fbAnon),
  ], [U.send, U.cancel]);
  ui.closePanel();
  if (i !== 0 || !text.value.trim()) return;
  const device = /iPhone|iPad/.test(navigator.userAgent) ? 'iPhone/iPad' : /Android/.test(navigator.userAgent) ? 'Android' : 'Computer';
  const context = `Pillars ${doneCount()}/6 · Spirits ${Object.keys(S.spirits).length}/${C.CREATURES.length} · Finished ${S.ended ? 'yes' : 'no'} · ${device} · ${lang}`;
  const F = C.FEEDBACK;
  try {
    // no-cors: Google doesn't allow reading the reply, so a resolved fetch means "sent".
    await fetch(`https://docs.google.com/forms/d/e/${F.formId}/formResponse`, {
      method: 'POST', mode: 'no-cors',
      body: new URLSearchParams({ [`entry.${F.textEntry}`]: text.value.trim(), [`entry.${F.contextEntry}`]: context }),
    });
    ui.toast(U.fbThanks);
  } catch (e) {
    ui.toast(U.fbFail, 4000);
  }
}

async function share() {
  const url = new URL(location.href); url.hash = ''; url.searchParams.delete('lang');   // friends get their own language
  const data = { title: C.TITLE, text: U.shareText, url: url.href };
  try {
    await navigator.share(data);
  } catch (e) {
    // Web Share can be missing or blocked (e.g. inside an embedded viewer); copy the link instead.
    try { await navigator.clipboard.writeText(data.url); ui.toast(U.linkCopied); }
    catch (e2) { ui.toast(U.copyManually); }
  }
}

    p.append(grid);                      // previews only animate once their canvas is on the page
    await new Promise(res => {
      const pick = ui.firstTap(id => { S.char = id; res(); });
      for (const ch of C.CHARACTERS) {
        const c = h('canvas', { width: '192', height: '192' });
        grid.append(h('button', { class: 'charcard', 'data-char': ch.id, onclick: () => pick(ch.id) }, c, h('b', {}, ch.name)));
        drawCharPreview(c, ch.id);
      }
    });
    ui.closePanel();
    S.pos = null;
  }
  const pos = S.pos || W.START;
  player.x = pos.x; player.y = pos.y; cam.x = player.x; cam.y = player.y;
  stopProcession(); dusk = duskTarget = 0; zoomK = zoomTarget = 1; lanternT = null;
  mode = 'play'; $('#hud').hidden = false; updateHud(); save();
  if (isNew || !S.seenIntro) { S.seenIntro = true; await ui.say(C.INTRO); save(); }
  if (S.finaleStage === 'procession') { startProcession(true); ui.toast(FT.summitToast, 4000); }
}

// ---------- boot ----------
async function boot() {
  document.title = C.TITLE;
  $('#pills').setAttribute('aria-label', U.aria.pills);
  $('#soundBtn').setAttribute('aria-label', U.aria.sound);
  $('#journalBtn').setAttribute('aria-label', U.aria.journal);
  requestAnimationFrame(frame);
  const t = title();
  await new Promise(r => setTimeout(r, 50));          // let the title paint first
  map = W.buildMap();
  colorLayer = W.paintWorld(map);
  inkLayer = W.inkify(colorLayer);
  try {
    const data = localStorage.getItem(MASK_KEY);
    if (data) { const img = new Image(); img.onload = () => mctx.drawImage(img, 0, 0); img.src = data; }
  } catch (e) {}
  t.ready();
  // Offline support when served from a website (not from a file or an embedded viewer).
  if ('serviceWorker' in navigator && /^https:|^http:\/\/localhost/.test(location.href) && !window.__SINGLE_FILE__)
    navigator.serviceWorker.register('sw.js').catch(() => {});
  addEventListener('pagehide', () => { if (mode === 'play') { S.pos = { x: player.x, y: player.y }; save(); saveMask(); } });
  if (location.hash === '#debug') window.GAME = { get S() { return S; }, player, audio, get map() { return map; }, meetGuardian, encounter, greatTree, openJournal, W, center, get followers() { return followers; }, get dusk() { return dusk; }, get near() { return near && near.label; }, get nearId() { return near && near.id; }, lang, i18n: I18N, C, FT, EXT: EX.TEXT };
}
boot();

return {  };
})();
})();
